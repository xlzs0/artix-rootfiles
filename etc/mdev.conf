-$MODALIAS=.* 0:0 660 @test "$ACTION" != add || /usr/bin/modprobe -bq "$MODALIAS" 2>/dev/null || :
-$SUBSYSTEM=tifm 0:0 660 @test "$ACTION" != add || test "$TIFM_CARD_TYPE" != SD || /usr/bin/modprobe -bq tifm_sd 2>/dev/null || :
-$SUBSYSTEM=tifm 0:0 660 @test "$ACTION" != add || test "$TIFM_CARD_TYPE" != MS || /usr/bin/modprobe -bq tifm_ms 2>/dev/null || :
-$SUBSYSTEM=memstick 0:0 660 @test "$ACTION" != add || /usr/bin/modprobe -bq ms_block mspro_block 2>/dev/null || :
-$SUBSYSTEM=i2o 0:0 660 @test "$ACTION" != add || /usr/bin/modprobe -bq i2o_block 2>/dev/null || :
-$SUBSYSTEM=module 0:0 660 @test "$ACTION" != add || test "$DEVNAME" != parport_pc || /usr/bin/modprobe -bq ppdev 2>/dev/null || :
-$MTD_FTL=smartmedia 0:0 660 @test "$ACTION" != add || /usr/bin/modprobe -bq sm_ftl 2>/dev/null || :

-$PCI_ID=10DE:.* 0:0 660 @test "$ACTION" = add -o "$ACTION" = bind && test "$DRIVER" = nvidia && /usr/bin/expr "$PCI_CLASS" : 03 >/dev/null && /usr/bin/nvidia-modprobe && /usr/bin/nvidia-modprobe -c0 -u || :

null      0:0   666
zero      0:0   666
full      0:0   666
random    0:0   666
urandom   0:0   666
tty       0:tty 666
ptmx      0:tty 666
console   0:tty 600
tty[0-9]* 0:tty 600
vcs.*     0:tty 660

$SUBSYSTEM=rtc 0:clock 660
$SUBSYSTEM=ptp 0:clock 664
-$SUBSYSTEM=input 0:input 660 @/usr/local/lib/mdev-input-alias
js[0-9]* 0:input 664
$SUBSYSTEM=input 0:input 660
$SUBSYSTEM=video4linux 0:video 660
$SUBSYSTEM=graphics 0:video 660
dri/renderD.* 0:render 666
$SUBSYSTEM=drm 0:video 660
$SUBSYSTEM=dvb 0:video 660
$SUBSYSTEM=media 0:video 660
$SUBSYSTEM=cec 0:video 660
$SUBSYSTEM=kfd 0:render 666
$SUBSYSTEM=accel 0:render 666
-.*/controlC[0-9]* 0:audio 660 @/bin/sh -c 'n=${MDEV##*/controlC}; /usr/bin/alsactl restore "$n"'
$SUBSYSTEM=sound 0:audio 660
sr[0-9]* 0:optical 660
sg[0-9]* 0:disk 660
$SUBSYSTEM=block 0:disk 660
$SUBSYSTEM=scsi_generic 0:disk 660
loop-control 0:disk 660
btrfs-control 0:disk 660
rawctl 0:disk 660
rfkill 0:rfkill 664
(.*/)?tun 0:0 666
fuse 0:0 666
kvm 0:kvm 666
vfio 0:0 666 =vfio/
vsock 0:0 666
vhost-vsock 0:kvm 666
vhost-net 0:kvm 666
udmabuf 0:kvm 660
rtc0 0:clock 660
